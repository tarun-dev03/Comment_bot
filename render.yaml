# Render Blueprint: https://render.com/docs/blueprint-spec
# Note: Render free Postgres databases expire after 30 days.
# To keep this 100% free forever without paid upgrades, use a free cloud Postgres provider
# (e.g. Neon.tech or Supabase.com) and set DATABASE_URL in Environment, or leave unset for SQLite.

services:
  - type: web
    name: comment-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_DEV_MODE
        value: "false"
      - key: EMAIL_LOGIN_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: MAX_MESSAGES_PER_DAY
        value: "0"
