# Render Blueprint: https://render.com/docs/blueprint-spec
# After deploy, set APP_URL to your service URL (https://comment-bot-xxxx.onrender.com)
# and add the same URL + /auth/google/callback in Google Cloud OAuth.

databases:
  - name: comment-bot-db
    plan: free
    databaseName: comment_bot
    user: comment_bot

services:
  - type: web
    name: comment-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: comment-bot-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_DEV_MODE
        value: "false"
      - key: EMAIL_LOGIN_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: MAX_MESSAGES_PER_DAY
        value: "0"
