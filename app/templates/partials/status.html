<dl class="status-dl">
  <dt>State</dt>
  <dd>{% if running %}<span style="color:#34d399; font-weight:600;">● Running</span>{% elif job %}{{ job.status|capitalize }}{% else %}Stopped{% endif %}</dd>
  <dt>Messages sent</dt>
  <dd style="font-family:'JetBrains Mono', monospace; font-weight:600;">{% if job %}{{ job.messages_sent }}{% else %}0{% endif %}</dd>
  {% if job and job.last_error %}
  <dt class="error-val">Notice</dt>
  <dd class="error-val">{{ job.last_error }}</dd>
  {% endif %}
</dl>
