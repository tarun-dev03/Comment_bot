<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Comment Bot — YouTube Live Automator{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=20261112_emerald">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
:root {
  /* Obsidian Forest & Charcoal Surfaces (zero blue tint) */
  --bg-base: #080c0a;
  --bg-surface: #0e1411;
  --bg-elevated: #141c17;
  --card-bg: rgba(17, 25, 21, 0.82);
  --card-bg-soft: rgba(13, 20, 16, 0.68);
  --card-border: rgba(214, 232, 220, 0.09);
  --card-border-hover: rgba(74, 222, 128, 0.30);

  /* Crisp Alabaster & Sage-Stone Neutrals */
  --text-main: #f2f6f3;
  --text-muted: #a3b1a7;
  --text-dim: #748279;

  /* Primary Brand Accent: Lush Mint Emerald */
  --accent-primary: #22c55e;
  --accent-bright: #4ade80;
  --accent-mint: #34d399;
  --accent-soft: #86efac;
  --accent-deep: #15803d;
  --accent-gradient: linear-gradient(135deg, #16a34a 0%, #22c55e 52%, #4ade80 100%);
  --accent-glow: rgba(34, 197, 94, 0.32);
  --on-accent: #04180c;

  /* Secondary Accent: Warm Champagne Gold / Brass */
  --gold: #decb4b;
  --gold-bright: #f2df68;
  --gold-soft: #f7ecaa;
  --gold-bg: rgba(222, 203, 75, 0.12);
  --gold-border: rgba(222, 203, 75, 0.34);

  /* Tertiary Accent: Botanical Sage-Lime */
  --sage-lime: #a3e635;
  --sage-lime-bg: rgba(163, 230, 53, 0.11);
  --sage-lime-border: rgba(163, 230, 53, 0.30);

  /* Semantic States */
  --success: #22c55e;
  --success-bg: rgba(34, 197, 94, 0.13);
  --success-border: rgba(74, 222, 128, 0.34);

  --warning: #decb4b;
  --warning-bg: rgba(222, 203, 75, 0.12);
  --warning-border: rgba(222, 203, 75, 0.35);

  --notice: #e6d35a;
  --notice-text: #f9efb9;
  --notice-bg: rgba(222, 203, 75, 0.13);
  --notice-border: rgba(230, 211, 90, 0.38);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.28);
  --shadow-md: 0 10px 28px -6px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 20px 44px -8px rgba(0, 0, 0, 0.58);
  --shadow-glow: 0 0 26px -2px var(--accent-glow);

  color-scheme: dark;
  font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  scrollbar-color: rgba(74, 222, 128, 0.28) #080c0a;
  scrollbar-width: thin;
}

body {
  background-color: var(--bg-base);
  color: var(--text-main);
  min-height: 100vh;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: rgba(8, 12, 10, 0.9);
}
::-webkit-scrollbar-thumb {
  background: rgba(163, 177, 167, 0.22);
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(74, 222, 128, 0.45);
}

.muted {
  color: var(--text-muted);
}

.ambient-glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(150px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.20;
}
.glow-top {
  width: 560px;
  height: 420px;
  background: radial-gradient(circle, #16a34a 0%, #84cc16 55%, transparent 80%);
  top: -170px;
  left: 50%;
  transform: translateX(-50%);
}
.glow-bottom {
  width: 480px;
  height: 420px;
  background: radial-gradient(circle, #decb4b 0%, #10b981 55%, transparent 78%);
  bottom: -170px;
  right: -120px;
}

.wrap {
  width: 100%;
  max-width: 840px;
  margin: 0 auto;
  padding: 0 1.25rem;
  position: relative;
  z-index: 1;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(8, 12, 10, 0.86);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--card-border);
}

.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 66px;
  gap: 0.75rem;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.65rem;
  text-decoration: none;
  color: var(--text-main);
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
}

.brand-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--accent-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--on-accent);
  box-shadow: 0 0 18px rgba(34, 197, 94, 0.35);
}

.brand-highlight {
  color: var(--accent-bright);
}

.brand-badge {
  font-size: 0.64rem;
  font-weight: 800;
  background: rgba(74, 222, 128, 0.12);
  border: 1px solid rgba(74, 222, 128, 0.28);
  padding: 2px 7px;
  border-radius: 999px;
  color: var(--accent-soft);
  letter-spacing: 0.06em;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 0.7rem;
}

.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.35rem 0.78rem;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  font-weight: 600;
  border: 1px solid transparent;
  transition: all 0.25s ease;
}

.status-chip.idle {
  background: rgba(163, 177, 167, 0.09);
  color: var(--text-muted);
  border-color: rgba(163, 177, 167, 0.18);
}
.status-chip.idle .status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-dim);
}

.status-chip.running {
  background: rgba(34, 197, 94, 0.15);
  color: var(--accent-soft);
  border-color: rgba(74, 222, 128, 0.38);
  box-shadow: 0 0 14px rgba(34, 197, 94, 0.18);
}
.status-chip.running .status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-bright);
  box-shadow: 0 0 8px var(--accent-bright);
  animation: pulseEmerald 1.8s infinite;
}

.status-chip.error {
  background: var(--notice-bg);
  color: var(--notice-text);
  border-color: var(--notice-border);
}

@keyframes pulseEmerald {
  0% { transform: scale(0.95); opacity: 0.8; }
  50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px var(--accent-bright); }
  100% { transform: scale(0.95); opacity: 0.8; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.user-menu {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.user-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--card-border);
  padding: 0.28rem 0.7rem 0.28rem 0.32rem;
  border-radius: var(--radius-full);
  font-size: 0.78rem;
  color: var(--text-muted);
  max-width: 195px;
}

.user-avatar {
  width: 23px;
  height: 23px;
  border-radius: 50%;
  background: var(--accent-gradient);
  color: var(--on-accent);
  font-weight: 800;
  font-size: 0.72rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.user-email-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.main-content {
  padding-top: 1.75rem;
  padding-bottom: 3.75rem;
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255, 255, 255, 0.03);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  margin-bottom: 1.25rem;
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.card:hover {
  border-color: var(--card-border-hover);
}

.card-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.05rem;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.card-title {
  font-size: 1.15rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  color: var(--text-main);
  letter-spacing: -0.015em;
}

.card-subtitle {
  color: var(--text-muted);
  font-size: 0.85rem;
  margin-top: -0.5rem;
  margin-bottom: 1rem;
  line-height: 1.5;
}

.hero-highlights {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 0.55rem;
  margin: 0 auto 1.6rem;
  max-width: 560px;
}

.hero-pill {
  background: rgba(34, 197, 94, 0.08);
  border: 1px solid rgba(74, 222, 128, 0.22);
  color: var(--accent-soft);
  padding: 0.32rem 0.75rem;
  border-radius: var(--radius-full);
  font-size: 0.76rem;
  font-weight: 600;
}

.session-banner {
  padding: 0.9rem 1.2rem;
  margin-bottom: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.85rem;
  flex-wrap: wrap;
  border-left: 4px solid var(--accent-primary);
}

.session-readiness-pills {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  flex-wrap: wrap;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.8rem;
  margin-bottom: 1.25rem;
}

.stat-box {
  background: var(--card-bg-soft);
  backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-md);
  padding: 0.95rem 1.05rem;
  display: flex;
  flex-direction: column;
  gap: 0.32rem;
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.stat-box:hover {
  transform: translateY(-2px);
  border-color: rgba(74, 222, 128, 0.25);
}

.stat-label {
  font-size: 0.69rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  font-weight: 700;
}

.stat-value {
  font-size: 1.38rem;
  font-weight: 800;
  color: var(--text-main);
  font-family: "JetBrains Mono", monospace;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
}

.stat-sub {
  font-size: 0.72rem;
  color: var(--text-muted);
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 1.15rem;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 0.48rem;
}

.field-label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.input-with-actions {
  display: flex;
  gap: 0.5rem;
  align-items: center;
  position: relative;
}

.input-icon-wrapper {
  position: relative;
  flex: 1;
}

.input-prefix-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent-mint);
  pointer-events: none;
  display: flex;
  align-items: center;
}

input[type="text"],
input[type="url"],
input[type="email"],
input[type="password"],
textarea,
select {
  width: 100%;
  background: rgba(10, 15, 12, 0.85);
  border: 1px solid rgba(214, 232, 220, 0.13);
  color: var(--text-main);
  padding: 0.75rem 0.95rem;
  border-radius: var(--radius-md);
  font-size: 0.92rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

input::placeholder,
textarea::placeholder {
  color: var(--text-dim);
}

.has-prefix input {
  padding-left: 2.45rem;
}

input:focus, textarea:focus, select:focus {
  border-color: var(--accent-bright);
  box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
  background: rgba(14, 21, 17, 0.96);
}

textarea {
  resize: vertical;
  min-height: 78px;
  font-family: "JetBrains Mono", monospace;
  font-size: 0.82rem;
}

.video-preview-card {
  display: none;
  background: rgba(10, 15, 12, 0.72);
  border: 1px solid rgba(74, 222, 128, 0.18);
  border-radius: var(--radius-md);
  padding: 0.75rem;
  margin-top: 0.45rem;
  gap: 0.85rem;
  align-items: center;
  animation: fadeIn 0.25s ease;
}

.video-thumb {
  width: 96px;
  height: 54px;
  border-radius: 6px;
  object-fit: cover;
  background: #141c17;
  flex-shrink: 0;
}

.video-info {
  display: flex;
  flex-direction: column;
  gap: 0.28rem;
  min-width: 0;
  flex: 1;
}

.video-title {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.video-meta {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.72rem;
  color: var(--text-muted);
}

.video-pill {
  font-family: "JetBrains Mono", monospace;
  background: rgba(74, 222, 128, 0.10);
  border: 1px solid rgba(74, 222, 128, 0.20);
  color: var(--accent-soft);
  padding: 1px 7px;
  border-radius: 4px;
  font-size: 0.7rem;
}

.stream-ext-link {
  color: var(--accent-bright);
  text-decoration: none;
  margin-left: auto;
  font-weight: 600;
}
.stream-ext-link:hover {
  text-decoration: underline;
}

.engine-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.8rem;
}

.engine-card {
  background: rgba(11, 17, 14, 0.78);
  border: 1.5px solid rgba(214, 232, 220, 0.09);
  border-radius: var(--radius-md);
  padding: 0.9rem 1rem;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  transition: all 0.22s ease;
  position: relative;
}

.engine-card:hover {
  background: rgba(17, 26, 21, 0.90);
  border-color: rgba(214, 232, 220, 0.22);
}

.engine-card.active {
  border-color: var(--accent-bright);
  background: rgba(34, 197, 94, 0.08);
  box-shadow: 0 0 18px rgba(34, 197, 94, 0.16);
}

.engine-card-icon {
  font-size: 1.2rem;
  line-height: 1;
  margin-top: 2px;
}

.engine-card-content {
  flex: 1;
}

.engine-card-title {
  font-size: 0.89rem;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 0.45rem;
  flex-wrap: wrap;
}

.engine-card-badge {
  font-size: 0.65rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
  letter-spacing: 0.02em;
}

.badge-green {
  background: rgba(34, 197, 94, 0.18);
  color: var(--accent-soft);
  border: 1px solid rgba(74, 222, 128, 0.34);
}

.badge-gold {
  background: var(--gold-bg);
  color: var(--gold-soft);
  border: 1px solid var(--gold-border);
}

.badge-neutral {
  background: rgba(163, 177, 167, 0.12);
  color: var(--text-muted);
  border: 1px solid rgba(163, 177, 167, 0.24);
}

.engine-card-desc {
  font-size: 0.76rem;
  color: var(--text-muted);
  margin-top: 0.28rem;
  line-height: 1.4;
}

.readiness-hint {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
  background: var(--gold-bg);
  border: 1px solid var(--gold-border);
  color: var(--gold-soft);
  border-radius: var(--radius-md);
  padding: 0.65rem 0.9rem;
  font-size: 0.8rem;
  line-height: 1.4;
}
.readiness-hint.visible {
  display: flex;
  animation: fadeIn 0.2s ease;
}

.presets-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.preset-chip {
  background: rgba(13, 19, 15, 0.85);
  border: 1px solid rgba(214, 232, 220, 0.11);
  color: var(--text-muted);
  padding: 0.46rem 0.85rem;
  border-radius: var(--radius-sm);
  font-size: 0.8rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}

.preset-chip:hover {
  background: rgba(23, 33, 27, 0.95);
  color: var(--text-main);
  border-color: rgba(74, 222, 128, 0.30);
}

.preset-chip.active {
  background: rgba(34, 197, 94, 0.16);
  color: var(--accent-soft);
  border-color: var(--accent-bright);
  box-shadow: 0 0 12px rgba(34, 197, 94, 0.20);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  font-family: inherit;
  font-weight: 600;
  font-size: 0.92rem;
  padding: 0.7rem 1.25rem;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  user-select: none;
}

.btn:focus-visible,
.preset-chip:focus-visible,
.engine-card:focus-visible {
  outline: 2px solid var(--accent-bright);
  outline-offset: 2px;
}

.btn:active {
  transform: scale(0.98);
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent-gradient);
  color: var(--on-accent);
  font-weight: 700;
  box-shadow: 0 4px 18px rgba(34, 197, 94, 0.30);
}
.btn-primary:hover:not(:disabled) {
  box-shadow: 0 6px 26px rgba(74, 222, 128, 0.45);
  transform: translateY(-1px);
  filter: brightness(1.04);
}

.btn-start-bot {
  flex: 2;
  font-size: 1.02rem;
  padding: 0.85rem 1.5rem;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.btn-stop-bot {
  flex: 1;
  background: var(--gold-bg);
  color: var(--gold-soft);
  border-color: var(--gold-border);
  font-size: 0.98rem;
  font-weight: 700;
}
.btn-stop-bot:hover:not(:disabled) {
  background: var(--gold);
  border-color: var(--gold-bright);
  color: #141203;
}

.btn-ghost {
  background: rgba(255, 255, 255, 0.045);
  color: var(--text-main);
  border-color: rgba(214, 232, 220, 0.13);
}
.btn-ghost:hover:not(:disabled) {
  background: rgba(74, 222, 128, 0.10);
  border-color: rgba(74, 222, 128, 0.32);
}

.btn-sm {
  padding: 0.38rem 0.78rem;
  font-size: 0.78rem;
  border-radius: var(--radius-sm);
}

.actions-row {
  display: flex;
  gap: 0.75rem;
  margin-top: 0.35rem;
}

.sample-preview-box {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  background: rgba(34, 197, 94, 0.08);
  border: 1px solid rgba(74, 222, 128, 0.25);
  border-radius: var(--radius-md);
  padding: 0.72rem 0.95rem;
  font-size: 0.84rem;
  color: var(--text-main);
  animation: fadeIn 0.25s ease;
}
.sample-preview-box.visible {
  display: flex;
}
.sample-preview-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent-soft);
  font-weight: 700;
  margin-bottom: 0.15rem;
}

.status-panel-wrapper {
  background: rgba(9, 14, 11, 0.88);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-md);
  margin-top: 1.25rem;
  overflow: hidden;
}

.status-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.68rem 1rem;
  background: rgba(18, 27, 22, 0.70);
  border-bottom: 1px solid var(--card-border);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
}

.status-dl {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 0.55rem 1rem;
  padding: 0.95rem 1rem;
  font-size: 0.85rem;
}

.status-dl dt {
  color: var(--text-dim);
  font-weight: 600;
}
.status-dl dd {
  color: var(--text-main);
}
.status-dl .error-val {
  color: var(--notice-text);
  background: var(--notice-bg);
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--notice-border);
}

.notice-banner {
  background: var(--notice-bg);
  border: 1px solid var(--notice-border);
  color: var(--notice-text);
  padding: 0.95rem 1.2rem;
  margin-bottom: 1.25rem;
}

.sync-key-box {
  background: rgba(34, 197, 94, 0.08);
  border: 1px solid rgba(74, 222, 128, 0.25);
  border-radius: var(--radius-md);
  padding: 0.9rem 1rem;
  margin-bottom: 1rem;
  font-size: 0.82rem;
  color: var(--accent-soft);
  line-height: 1.5;
}

.conn-card {
  border-left: 4px solid var(--gold);
}
.conn-card.active {
  border-left-color: var(--accent-primary);
}

.conn-subcard {
  background: rgba(10, 15, 12, 0.70);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-md);
  padding: 1.05rem;
  display: flex;
  flex-direction: column;
}

.conn-flex {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.stage-flow {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 0.95rem;
}

.stage-pill {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--accent-soft);
  background: rgba(34, 197, 94, 0.09);
  border: 1px solid rgba(74, 222, 128, 0.20);
  padding: 0.22rem 0.6rem;
  border-radius: var(--radius-full);
}

.stage-pill.arc {
  color: var(--gold-soft);
  background: var(--gold-bg);
  border-color: var(--gold-border);
}

.phrase-input-row {
  display: flex;
  gap: 0.5rem;
}

.phrase-tags-container {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  margin-top: 0.85rem;
  max-height: 210px;
  overflow-y: auto;
  padding-right: 4px;
}

.phrase-tag {
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid rgba(214, 232, 220, 0.11);
  color: var(--text-main);
  padding: 0.36rem 0.68rem;
  border-radius: var(--radius-sm);
  font-size: 0.8rem;
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  transition: all 0.2s ease;
}
.phrase-tag:hover {
  background: rgba(74, 222, 128, 0.08);
  border-color: rgba(74, 222, 128, 0.25);
}

.phrase-tag-remove {
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  transition: all 0.15s ease;
}
.phrase-tag-remove:hover {
  color: var(--gold-soft);
  background: var(--gold-bg);
}

.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  pointer-events: none;
  max-width: min(360px, calc(100vw - 32px));
}

.toast {
  pointer-events: auto;
  background: rgba(13, 20, 16, 0.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(214, 232, 220, 0.14);
  color: var(--text-main);
  padding: 0.78rem 1.15rem;
  border-radius: var(--radius-md);
  font-size: 0.85rem;
  font-weight: 500;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.52);
  display: flex;
  align-items: center;
  gap: 0.6rem;
  transform: translateY(20px);
  opacity: 0;
  animation: toastSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.toast.success {
  border-left: 4px solid var(--accent-primary);
}
.toast.error {
  border-left: 4px solid var(--notice);
}
.toast.info {
  border-left: 4px solid var(--sage-lime);
}

@keyframes toastSlideUp {
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.site-footer {
  border-top: 1px solid var(--card-border);
  padding: 1.5rem 0;
  margin-top: 2rem;
  font-size: 0.78rem;
  color: var(--text-dim);
}

.footer-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.footer-separator {
  margin: 0 0.3rem;
  opacity: 0.45;
}

.footer-link {
  color: var(--text-muted);
  text-decoration: none;
  margin-left: 0.75rem;
  transition: color 0.2s;
}
.footer-link:hover {
  color: var(--accent-bright);
}

@media (max-width: 640px) {
  .stats-grid {
    grid-template-columns: 1fr 1fr;
  }
  .engine-options {
    grid-template-columns: 1fr;
  }
  .actions-row {
    flex-direction: column;
  }
  .btn-start-bot, .btn-stop-bot {
    width: 100%;
    flex: none;
  }
  .input-with-actions {
    flex-wrap: wrap;
  }
  .input-with-actions input[type="url"] {
    min-width: 100%;
  }
  .phrase-input-row {
    flex-direction: column;
  }
  .status-dl {
    grid-template-columns: 112px 1fr;
  }
  .user-email-text {
    max-width: 92px;
  }
  .toast-container {
    right: 16px;
    bottom: 16px;
  }
}
  </style>
</head>
<body>
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <span class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
          </svg>
        </span>
        <span class="brand-text">Comment<span class="brand-highlight">Bot</span></span>
        <span class="brand-badge">PRO</span>
      </a>

      <div class="topbar-actions">
        <div id="topbar-live-status" class="status-chip idle">
          <span class="status-dot"></span>
          <span class="status-label">Bot Idle</span>
        </div>

        {% if user %}
        <div class="user-menu">
          <div class="user-pill" title="{{ user.email }}">
            <span class="user-avatar">{{ user.email[0]|upper }}</span>
            <span class="user-email-text">{{ user.email }}</span>
          </div>
          <form action="/auth/logout" method="post" style="margin:0;">
            <button type="submit" class="btn btn-ghost btn-sm" title="Sign out of this session">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Exit</span>
            </button>
          </form>
        </div>
        {% endif %}
      </div>
    </div>
  </header>

  <main class="wrap main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-content">
      <div class="footer-left">
        <span>⚡ YouTube Comment Bot</span>
        <span class="footer-separator">•</span>
        <span>Isolated multi-user cloud runner</span>
      </div>
      <div class="footer-right">
        <a href="https://github.com/tarun-dev03/Comment_bot" target="_blank" rel="noreferrer" class="footer-link">Repository</a>
        <a href="/ready" class="footer-link">System Health</a>
      </div>
    </div>
  </footer>

  <div id="toast-container" class="toast-container"></div>
</body>
</html>
