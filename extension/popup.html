<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Cookie Auto-Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 348px;
      padding: 16px;
      background: #12110d;
      color: #f0ede0;
      font-size: 13px;
      color-scheme: dark;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(214, 206, 178, 0.14);
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f0ede0;
    }
    .title-accent {
      color: #bfd5a9;
    }
    .badge {
      font-size: 10px;
      background: rgba(203, 180, 86, 0.16);
      color: #eadca0;
      border: 1px solid rgba(203, 180, 86, 0.36);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .badge.connected {
      background: rgba(143, 179, 121, 0.18);
      color: #bfd5a9;
      border-color: rgba(143, 179, 121, 0.36);
    }
    .session-card {
      background: #1c1b15;
      border: 1px solid rgba(214, 206, 178, 0.12);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .session-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #878370;
    }
    .dot.green { background: #8fb379; box-shadow: 0 0 8px rgba(143, 179, 121, 0.45); }
    .dot.gold { background: #cbb456; }
    .muted {
      color: #b6b19c;
      font-size: 11px;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #b6b19c;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.45px;
    }
    input, select {
      width: 100%;
      background: #181712;
      border: 1px solid rgba(214, 206, 178, 0.16);
      color: #f0ede0;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      border-color: #a4c686;
      box-shadow: 0 0 0 2px rgba(143, 179, 121, 0.20);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .toggle-checkbox {
      width: 16px;
      height: 16px;
      accent-color: #8fb379;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #628656 0%, #84a96d 55%, #a2be7c 100%);
      color: #10150d;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      transition: filter 0.2s, transform 0.15s;
    }
    .btn:hover:not(:disabled) {
      filter: brightness(1.06);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-sub {
      flex: 1;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 600;
      background: #232119;
      color: #dfd5b2;
      border: 1px solid rgba(196, 184, 141, 0.24);
    }
    .btn-sub:hover:not(:disabled) {
      background: #2d2a1f;
      border-color: rgba(196, 184, 141, 0.42);
    }
    .btn-sub-save {
      flex: 1;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(143, 179, 121, 0.15);
      color: #bfd5a9;
      border: 1px solid rgba(143, 179, 121, 0.34);
    }
    .btn-sub-save:hover:not(:disabled) {
      background: rgba(143, 179, 121, 0.24);
    }
    .status-msg {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.4;
      display: none;
    }
    .status-msg.success {
      display: block;
      background: rgba(143, 179, 121, 0.14);
      color: #bfd5a9;
      border: 1px solid rgba(143, 179, 121, 0.34);
    }
    .status-msg.error {
      display: block;
      background: rgba(203, 180, 86, 0.14);
      color: #eadca0;
      border: 1px solid rgba(203, 180, 86, 0.36);
    }
    .status-msg.info {
      display: block;
      background: rgba(158, 166, 94, 0.14);
      color: #cbd094;
      border: 1px solid rgba(158, 166, 94, 0.34);
    }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #878370;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>🌿 Comment<span class="title-accent">Bot</span></span>
    </div>
    <span id="badge-status" class="badge">Checking...</span>
  </div>

  <div class="session-card">
    <div class="session-status">
      <div id="yt-dot" class="dot"></div>
      <span id="yt-text">Checking YouTube session...</span>
    </div>
    <p id="yt-subtext" class="muted">Make sure you are logged into youtube.com</p>
  </div>

  <div class="field">
    <label for="app-url">Comment Bot App URL</label>
    <input type="url" id="app-url" value="http://localhost:8000" placeholder="http://localhost:8000">
  </div>

  <div class="field">
    <label for="user-email">Account Email (Verified Match)</label>
    <input type="email" id="user-email" placeholder="e.g. you@example.com">
  </div>

  <div class="field">
    <label for="sync-token">Extension Sync Key (From Dashboard)</label>
    <input type="password" id="sync-token" placeholder="Auto-filled when signed in, or paste from Dashboard">
  </div>

  <div class="field">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <label for="stream-url" style="margin-bottom:0;">Live Stream URL (Kept until updated)</label>
      <span id="link-save-badge" class="muted" style="font-size:10px; color:#bfd5a9; display:none;">✓ Saved</span>
    </div>
    <input type="url" id="stream-url" placeholder="https://www.youtube.com/watch?v=..." style="margin-top:4px;">
    <div style="display:flex; gap:6px; margin-top:6px;">
      <button type="button" id="btn-use-tab" class="btn btn-sub">
        ▸ Use Active Tab
      </button>
      <button type="button" id="btn-save-link" class="btn btn-sub-save">
        💾 Save Link
      </button>
    </div>
  </div>

  <div class="field">
    <label for="sync-interval">Auto-Sync Interval</label>
    <select id="sync-interval">
      <option value="10">Every 10 minutes</option>
      <option value="15" selected>Every 15 minutes (Recommended)</option>
      <option value="30">Every 30 minutes</option>
      <option value="60">Every 60 minutes</option>
    </select>
  </div>

  <div class="row">
    <label class="toggle-label" for="auto-sync">
      <input type="checkbox" id="auto-sync" class="toggle-checkbox" checked>
      <span>Background Auto-Sync</span>
    </label>
    <span class="muted" id="last-sync-time">Never synced</span>
  </div>

  <button id="btn-sync" class="btn">
    <span>🔄 Sync YouTube Cookie Now</span>
  </button>

  <div id="status-msg" class="status-msg"></div>

  <div class="footer">
    Isolated background sync • Zero DevTools needed
  </div>

  <script src="popup.js"></script>
</body>
</html>
