<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Cookie Auto-Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 348px;
      padding: 16px;
      background: #080c0a;
      color: #f2f6f3;
      font-size: 13px;
      color-scheme: dark;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(214, 232, 220, 0.12);
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f2f6f3;
    }
    .title-accent {
      color: #4ade80;
    }
    .badge {
      font-size: 10px;
      background: rgba(222, 203, 75, 0.16);
      color: #f7ecaa;
      border: 1px solid rgba(222, 203, 75, 0.36);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .badge.connected {
      background: rgba(34, 197, 94, 0.18);
      color: #86efac;
      border-color: rgba(74, 222, 128, 0.35);
    }
    .session-card {
      background: #111915;
      border: 1px solid rgba(214, 232, 220, 0.09);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .session-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #748279;
    }
    .dot.green { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }
    .dot.gold { background: #decb4b; }
    .muted {
      color: #a3b1a7;
      font-size: 11px;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #a3b1a7;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.45px;
    }
    input, select {
      width: 100%;
      background: #101713;
      border: 1px solid rgba(214, 232, 220, 0.14);
      color: #f2f6f3;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      border-color: #4ade80;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.18);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .toggle-checkbox {
      width: 16px;
      height: 16px;
      accent-color: #22c55e;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #16a34a 0%, #22c55e 52%, #4ade80 100%);
      color: #04180c;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      transition: filter 0.2s, transform 0.15s;
    }
    .btn:hover:not(:disabled) {
      filter: brightness(1.06);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-sub {
      flex: 1;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 600;
      background: #1a241f;
      color: #f2f6f3;
      border: 1px solid rgba(214, 232, 220, 0.16);
    }
    .btn-sub:hover:not(:disabled) {
      background: #223029;
      border-color: rgba(74, 222, 128, 0.35);
    }
    .btn-sub-save {
      flex: 1;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border: 1px solid rgba(74, 222, 128, 0.34);
    }
    .btn-sub-save:hover:not(:disabled) {
      background: rgba(34, 197, 94, 0.24);
    }
    .status-msg {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.4;
      display: none;
    }
    .status-msg.success {
      display: block;
      background: rgba(34, 197, 94, 0.14);
      color: #86efac;
      border: 1px solid rgba(74, 222, 128, 0.32);
    }
    .status-msg.error {
      display: block;
      background: rgba(222, 203, 75, 0.14);
      color: #f7ecaa;
      border: 1px solid rgba(222, 203, 75, 0.36);
    }
    .status-msg.info {
      display: block;
      background: rgba(163, 230, 53, 0.12);
      color: #d9f99d;
      border: 1px solid rgba(163, 230, 53, 0.30);
    }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #748279;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>⚡ Comment<span class="title-accent">Bot</span></span>
    </div>
    <span id="badge-status" class="badge">Checking...</span>
  </div>

  <div class="session-card">
    <div class="session-status">
      <div id="yt-dot" class="dot"></div>
      <span id="yt-text">Checking YouTube session...</span>
    </div>
    <p id="yt-subtext" class="muted">Make sure you are logged into youtube.com</p>
  </div>

  <div class="field">
    <label for="app-url">Comment Bot App URL</label>
    <input type="url" id="app-url" value="http://localhost:8000" placeholder="http://localhost:8000">
  </div>

  <div class="field">
    <label for="user-email">Account Email (Verified Match)</label>
    <input type="email" id="user-email" placeholder="e.g. you@example.com">
  </div>

  <div class="field">
    <label for="sync-token">Extension Sync Key (From Dashboard)</label>
    <input type="password" id="sync-token" placeholder="Auto-filled when signed in, or paste from Dashboard">
  </div>

  <div class="field">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <label for="stream-url" style="margin-bottom:0;">Live Stream URL (Kept until updated)</label>
      <span id="link-save-badge" class="muted" style="font-size:10px; color:#4ade80; display:none;">✓ Saved</span>
    </div>
    <input type="url" id="stream-url" placeholder="https://www.youtube.com/watch?v=..." style="margin-top:4px;">
    <div style="display:flex; gap:6px; margin-top:6px;">
      <button type="button" id="btn-use-tab" class="btn btn-sub">
        ▸ Use Active Tab
      </button>
      <button type="button" id="btn-save-link" class="btn btn-sub-save">
        💾 Save Link
      </button>
    </div>
  </div>

  <div class="field">
    <label for="sync-interval">Auto-Sync Interval</label>
    <select id="sync-interval">
      <option value="10">Every 10 minutes</option>
      <option value="15" selected>Every 15 minutes (Recommended)</option>
      <option value="30">Every 30 minutes</option>
      <option value="60">Every 60 minutes</option>
    </select>
  </div>

  <div class="row">
    <label class="toggle-label" for="auto-sync">
      <input type="checkbox" id="auto-sync" class="toggle-checkbox" checked>
      <span>Background Auto-Sync</span>
    </label>
    <span class="muted" id="last-sync-time">Never synced</span>
  </div>

  <button id="btn-sync" class="btn">
    <span>🔄 Sync YouTube Cookie Now</span>
  </button>

  <div id="status-msg" class="status-msg"></div>

  <div class="footer">
    Isolated background sync • Zero DevTools needed
  </div>

  <script src="popup.js"></script>
</body>
</html>
