<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Cookie Auto-Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 348px;
      padding: 16px;
      background-color: #f6f4fb;
      background-image:
        radial-gradient(circle at top left, rgba(169, 237, 211, 0.45) 0%, transparent 52%),
        radial-gradient(circle at bottom right, rgba(213, 198, 255, 0.45) 0%, transparent 52%);
      color: #252236;
      font-size: 13px;
      color-scheme: light;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(114, 99, 158, 0.16);
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #252236;
    }
    .title-accent {
      color: #473187;
    }
    .badge {
      font-size: 10px;
      background: #ffe7dc;
      color: #7d3b22;
      border: 1px solid #f8bea4;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .badge.connected {
      background: #dcf8ec;
      color: #11583e;
      border-color: #9fe7c8;
    }
    .session-card {
      background: #ffffff;
      border: 1px solid rgba(114, 99, 158, 0.16);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      box-shadow: 0 4px 14px rgba(103, 86, 158, 0.06);
    }
    .session-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9f98b3;
    }
    .dot.green { background: #27a876; box-shadow: 0 0 8px rgba(39, 168, 118, 0.35); }
    .dot.gold { background: #e89b3c; }
    .muted {
      color: #5b5570;
      font-size: 11px;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #5b5570;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.45px;
    }
    input, select {
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(114, 99, 158, 0.22);
      color: #252236;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      border-color: #84d3b6;
      box-shadow: 0 0 0 3px rgba(156, 235, 208, 0.35);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: #252236;
      text-transform: none;
      letter-spacing: 0;
    }
    .toggle-checkbox {
      width: 16px;
      height: 16px;
      accent-color: #6b52ae;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #9cebd0 0%, #a9d8fc 52%, #cbb8fe 100%);
      color: #1e1930;
      border: 1px solid rgba(114, 99, 158, 0.14);
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(164, 178, 245, 0.30);
      transition: filter 0.2s, transform 0.15s;
    }
    .btn:hover:not(:disabled) {
      filter: brightness(0.97);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-sub {
      flex: 1;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 600;
      background: #f2edff;
      color: #473187;
      border: 1px solid #cdbefe;
      box-shadow: none;
    }
    .btn-sub:hover:not(:disabled) {
      background: #e8e0ff;
      border-color: #b7a2fc;
    }
    .btn-sub-save {
      flex: 1;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 600;
      background: #dcf8ec;
      color: #11583e;
      border: 1px solid #9fe7c8;
      box-shadow: none;
    }
    .btn-sub-save:hover:not(:disabled) {
      background: #c9f2e1;
    }
    .status-msg {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.4;
      display: none;
    }
    .status-msg.success {
      display: block;
      background: #dcf8ec;
      color: #11583e;
      border: 1px solid #9fe7c8;
    }
    .status-msg.error {
      display: block;
      background: #ffe7dc;
      color: #7d3b22;
      border: 1px solid #f8bea4;
    }
    .status-msg.info {
      display: block;
      background: #dff2ff;
      color: #17547d;
      border: 1px solid #9bd4fa;
    }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #7b7491;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>✨ Comment<span class="title-accent">Bot</span></span>
    </div>
    <span id="badge-status" class="badge">Checking...</span>
  </div>

  <div class="session-card">
    <div class="session-status">
      <div id="yt-dot" class="dot"></div>
      <span id="yt-text">Checking YouTube session...</span>
    </div>
    <p id="yt-subtext" class="muted">Make sure you are logged into youtube.com</p>
  </div>

  <div class="field">
    <label for="app-url">Comment Bot App URL</label>
    <input type="url" id="app-url" value="http://localhost:8000" placeholder="http://localhost:8000">
  </div>

  <div class="field">
    <label for="user-email">Account Email (Verified Match)</label>
    <input type="email" id="user-email" placeholder="e.g. you@example.com">
  </div>

  <div class="field">
    <label for="sync-token">Extension Sync Key (From Dashboard)</label>
    <input type="password" id="sync-token" placeholder="Auto-filled when signed in, or paste from Dashboard">
  </div>

  <div class="field">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <label for="stream-url" style="margin-bottom:0;">Live Stream URL (Kept until updated)</label>
      <span id="link-save-badge" class="muted" style="font-size:10px; color:#11583e; display:none;">✓ Saved</span>
    </div>
    <input type="url" id="stream-url" placeholder="https://www.youtube.com/watch?v=..." style="margin-top:4px;">
    <div style="display:flex; gap:6px; margin-top:6px;">
      <button type="button" id="btn-use-tab" class="btn btn-sub">
        ▸ Use Active Tab
      </button>
      <button type="button" id="btn-save-link" class="btn btn-sub-save">
        💾 Save Link
      </button>
    </div>
  </div>

  <div class="field">
    <label for="sync-interval">Auto-Sync Interval</label>
    <select id="sync-interval">
      <option value="10">Every 10 minutes</option>
      <option value="15" selected>Every 15 minutes (Recommended)</option>
      <option value="30">Every 30 minutes</option>
      <option value="60">Every 60 minutes</option>
    </select>
  </div>

  <div class="row">
    <label class="toggle-label" for="auto-sync">
      <input type="checkbox" id="auto-sync" class="toggle-checkbox" checked>
      <span>Background Auto-Sync</span>
    </label>
    <span class="muted" id="last-sync-time">Never synced</span>
  </div>

  <button id="btn-sync" class="btn">
    <span>🔄 Sync YouTube Cookie Now</span>
  </button>

  <div id="status-msg" class="status-msg"></div>

  <div class="footer">
    Isolated background sync • Zero DevTools needed
  </div>

  <script src="popup.js"></script>
</body>
</html>
