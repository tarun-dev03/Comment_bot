<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Cookie Auto-Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 340px;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      background: #ef4444;
      color: white;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 600;
    }
    .badge.connected {
      background: #10b981;
    }
    .session-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .session-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .dot.green { background: #10b981; }
    .dot.amber { background: #f59e0b; }
    .dot.red { background: #ef4444; }
    .muted {
      color: #94a3b8;
      font-size: 11px;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #38bdf8;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .toggle-checkbox {
      width: 16px;
      height: 16px;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.4;
      display: none;
    }
    .status-msg.success {
      display: block;
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #047857;
    }
    .status-msg.error {
      display: block;
      background: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #b91c1c;
    }
    .status-msg.info {
      display: block;
      background: #1e3a8a;
      color: #93c5fd;
      border: 1px solid #2563eb;
    }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>⚡ Comment Bot</span>
    </div>
    <span id="badge-status" class="badge">Checking...</span>
  </div>

  <div class="session-card">
    <div class="session-status">
      <div id="yt-dot" class="dot"></div>
      <span id="yt-text">Checking YouTube session...</span>
    </div>
    <p id="yt-subtext" class="muted">Make sure you are logged into youtube.com</p>
  </div>

  <div class="field">
    <label for="app-url">Comment Bot App URL</label>
    <input type="url" id="app-url" value="http://localhost:8000" placeholder="http://localhost:8000">
  </div>

  <div class="field">
    <label for="user-email">Account Email (Optional)</label>
    <input type="email" id="user-email" placeholder="e.g. you@example.com">
  </div>

  <div class="field">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <label for="stream-url" style="margin-bottom:0;">Live Stream URL (Kept until updated)</label>
      <span id="link-save-badge" class="muted" style="font-size:10px; color:#10b981; display:none;">✓ Saved</span>
    </div>
    <input type="url" id="stream-url" placeholder="https://www.youtube.com/watch?v=..." style="margin-top:4px;">
    <div style="display:flex; gap:6px; margin-top:6px;">
      <button type="button" id="btn-use-tab" class="btn" style="flex:1; padding:6px 8px; font-size:11px; background:#334155;">
        🎯 Use Active Tab
      </button>
      <button type="button" id="btn-save-link" class="btn" style="flex:1; padding:6px 8px; font-size:11px; background:#047857;">
        💾 Save Link
      </button>
    </div>
  </div>

  <div class="field">
    <label for="sync-interval">Auto-Sync Interval</label>
    <select id="sync-interval">
      <option value="10">Every 10 minutes</option>
      <option value="15" selected>Every 15 minutes (Recommended)</option>
      <option value="30">Every 30 minutes</option>
      <option value="60">Every 60 minutes</option>
    </select>
  </div>

  <div class="row">
    <label class="toggle-label" for="auto-sync">
      <input type="checkbox" id="auto-sync" class="toggle-checkbox" checked>
      <span>Background Auto-Sync</span>
    </label>
    <span class="muted" id="last-sync-time">Never synced</span>
  </div>

  <button id="btn-sync" class="btn">
    <span>🔄 Sync YouTube Cookie Now</span>
  </button>

  <div id="status-msg" class="status-msg"></div>

  <div class="footer">
    Runs in background while browser is open • No DevTools needed
  </div>

  <script src="popup.js"></script>
</body>
</html>
